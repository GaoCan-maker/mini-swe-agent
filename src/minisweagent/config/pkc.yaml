# Phase-Keyframe Compaction. Layer on top of another config, e.g.
#   mini-extra swebench -c swebench.yaml -c pkc.yaml ...
agent:
  agent_class: pkc
  pkc:
    enabled: true
    triggers: [first_green, new_target, revert]  # phase events only mark history as stale
    min_steps: 10
    min_gap: 5
    min_prompt_tokens: 64000  # phase folds wait for this prompt size; 0 disables the gate
    min_fold_fraction: 0.2  # a phase fold must remove at least this share of the prompt
    high_water: 120000  # fold at this prompt size even without a phase mark; 0 disables
    low_water: 45000  # a high-water fold must get below this size, or at least halve the prompt
    defer_edit_burst: true
    max_defer: 8
    keep_turns: 2
    recent_budget: 12000  # tokens of recent turns kept verbatim
    checkpoint_at: first_fold  # e1 | first_fold | never
    ws_budget: 8000
    ws_symbol_max_lines: 150
    ws_hunk_context: 10
    history_budget: 800
    keep_budget: 1500
    checkpoint_max_tokens: 400
    delta_max_tokens: 300
    ctx:
      dir: /tmp/.pkc
    hot:
      restore_count: 2
      restore_window: 10
      reread_window: 10
