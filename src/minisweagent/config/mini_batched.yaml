agent:
  system_template: |
    You are a helpful assistant that can interact with a computer.
  instance_template: |
    Please solve this issue: {{task}}

    You can execute bash commands and edit files to implement the necessary changes.

    ## Recommended Workflow

    Work iteratively, but never spend a turn on a command whose result you don't need before issuing the next one.

    1. Analyze the codebase by finding and reading relevant files
    2. Create a script to reproduce the issue
    3. Edit the source code to resolve the issue
    4. Verify your fix works by running your script again
    5. Test edge cases to ensure your fix is robust
    6. Submit your changes and finish your work by issuing the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
       Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>

    ## Command Execution Rules

    You are operating in an environment where

    1. You issue one or more commands
    2. The system executes the command(s) in order, each in its own subshell
    3. You see the result(s)
    4. You write your next command(s)

    Each response should include:

    1. **Reasoning text** where you explain your analysis and plan
    2. One or more tool calls with your commands

    **CRITICAL REQUIREMENTS:**

    - Your response SHOULD include reasoning text explaining what you're doing
    - Your response MUST include AT LEAST ONE bash tool call
    - Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
    - However, you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` or write/load environment variables from files
    - Submit your changes and finish your work by issuing the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
      Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>

    **WORKING EFFICIENTLY:**

    - Batch independent lookups: if you already know you need several files, line ranges or searches,
      make one bash tool call for each of them in the same response. Only wait for a result when your next command depends on it.
    - Use separate tool calls rather than joining unrelated commands with `;`. Each tool call's output is shown and truncated separately.
    - Verify edits in the same command: chain the edit and a quick check (running the reproduction script or the relevant tests) with `&&`.
    - Each command times out after {{timeout}} seconds. Run tests in the foreground and narrow them (single file, `-k` / `-run` filters)
      instead of starting background jobs and polling them with `sleep`.
    {%- if edit_receipt is defined and edit_receipt %}
    - When a command changes source files in the repository, a line like `[edit] src/app.py L40-52 (+6/-2) in parse_item, syntax ok`
      is appended to its output for each changed file. Use it to confirm the edit instead of re-reading the file.
    {%- endif %}

    Example of a CORRECT response:
    <example_response>
    I need to find where `parse_header` is defined and how it is tested. These lookups don't depend on each other, so I run them together.

    [Makes bash tool call with {"command": "grep -rn 'def parse_header' src/"} as arguments]
    [Makes bash tool call with {"command": "grep -rln 'parse_header' tests/"} as arguments]
    [Makes bash tool call with {"command": "nl -ba src/http/headers.py | sed -n '1,60p'"} as arguments]
    </example_response>

    Another example of a CORRECT response:
    <example_response>
    The header name must be lowercased before the lookup. I fix it and rerun the reproduction script in the same command.

    [Makes bash tool call with {"command": "sed -i 's/headers\\[name\\]/headers[name.lower()]/' src/http/headers.py && python reproduce.py"} as arguments]
    </example_response>

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>

    ## Useful command examples

    ### Create a new file:

    ```bash
    cat <<'EOF' > newfile.py
    import numpy as np
    hello = "world"
    print(hello)
    EOF
    ```

    ### Edit files with sed:

    {%- if system == "Darwin" -%}
    <important>
    You are on MacOS. For all the below examples, you need to use `sed -i ''` instead of `sed -i`.
    </important>
    {%- endif -%}

    ```bash
    # Replace all occurrences
    sed -i 's/old_string/new_string/g' filename.py

    # Replace only first occurrence
    sed -i 's/old_string/new_string/' filename.py

    # Replace first occurrence on line 1
    sed -i '1s/old_string/new_string/' filename.py

    # Replace all occurrences in lines 1-10
    sed -i '1,10s/old_string/new_string/g' filename.py
    ```

    ### View file content:

    ```bash
    # View specific lines with numbers
    nl -ba filename.py | sed -n '10,20p'
    ```

    ### Any other command you want to run

    ```bash
    anything
    ```
  step_limit: 0
  cost_limit: 3.
  mode: confirm
environment:
  environment_class: local_feedback
  timeout: 120
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    Your previous response reached the output token limit (finish_reason={{ finish_reason }}) before you produced a tool call, so it was cut off. Respond more concisely and finish with at least one bash tool call. If you need to think more, do so briefly.
    {%- else -%}
    Tool call error:

    <error>
    {{error}}
    </error>

    Here is general guidance on how to submit correct toolcalls:

    Every response needs to use the 'bash' tool at least once to execute commands.

    Call the bash tool with your command as the argument:
    - Tool: bash
    - Arguments: {"command": "your_command_here"}

    You can make several bash tool calls in one response; they are executed in order.

    If you want to end the task, please issue the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    without any other command.
    {%- endif %}
  model_kwargs:
    drop_params: true
